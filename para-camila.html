<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hola Camila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --amarillo: #FCCB14;
    --amarillo-claro: #FFD93D;
    --naranja: #F5A31A;
    --crema: #F7E9D0;
    --cafe: #5A3418;
    --cafe-oscuro: #3B1F0D;
    --verde: #5B9A3E;
    --verde-oscuro: #2F4A1C;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --texto: "Fraunces", Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--amarillo);
    overflow: hidden;
    font-family: var(--texto);
  }

  .vista {
    position: fixed;
    inset: 0;
    transition: opacity .7s ease, transform .7s ease;
  }
  .vista[hidden] { display: none; }
  .vista.saliendo { opacity: 0; transform: scale(1.06); pointer-events: none; }

  /* ---------- Portada ---------- */
  #portada { background: var(--amarillo); display: grid; place-items: center; }

  .pila {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .02em;
    font-family: var(--display);
    font-size: min(15vw, 8rem);
    line-height: .95;
    text-transform: uppercase;
    letter-spacing: .01em;
        user-select: none;
  }
  .hola  { color: #fff; }
  .nombre {
    color: transparent;
    -webkit-text-stroke: max(2px, .018em) #fff;
  }
  .par { display: flex; flex-direction: column; align-items: center; font: inherit; margin: .12em 0; }

  .boton-flor {
    position: absolute;
    left: 50%;
    bottom: max(9vh, 2.5rem);
    transform: translateX(-50%);
    font-family: var(--display);
    font-size: 1.15rem;
    letter-spacing: .04em;
    color: var(--cafe);
    background: #fff;
    border: 3px solid #fff;
    padding: .85em 2.2em;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(90, 52, 24, .35);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  }
  .boton-flor:hover {
    transform: translate(-50%, -3px);
    box-shadow: 0 9px 0 rgba(90, 52, 24, .35);
    background: var(--cafe);
    border-color: var(--cafe);
    color: #fff;
  }
  .boton-flor:active { transform: translate(-50%, 3px); box-shadow: 0 2px 0 rgba(90, 52, 24, .35); }
  .boton-flor:focus-visible, .volver:focus-visible { outline: 3px solid var(--cafe); outline-offset: 4px; }

  /* ---------- Vista del girasol ---------- */
  #girasol { background: var(--crema); overflow: hidden; }
  #girasol:not([hidden]) { animation: aparece .8s ease both; }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }

  .titulo-vertical {
    position: absolute;
    left: clamp(.6rem, 3vw, 2.4rem);
    top: 50%;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    font-family: var(--display);
    font-size: clamp(2.2rem, 7vw, 4.6rem);
    line-height: 1;
    color: var(--cafe);
    letter-spacing: .03em;
    text-transform: uppercase;
    z-index: 3;
  }

  .detalle {
    position: absolute;
    top: clamp(1.2rem, 5vh, 3rem);
    left: 50%;
    transform: translateX(-50%);
    width: min(78vw, 24rem);
    text-align: center;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    color: var(--cafe-oscuro);
    z-index: 3;
  }
  .detalle small {
    display: block;
    margin-top: .5rem;
    font-size: .8em;
    color: rgba(59, 31, 13, .6);
  }

  .volver {
    position: absolute;
    top: 1rem;
    right: 1rem;
    z-index: 4;
    font-family: var(--texto);
    font-size: .95rem;
    color: var(--cafe);
    background: transparent;
    border: 2px solid var(--cafe);
    border-radius: 999px;
    padding: .4em 1.1em;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .volver:hover { background: var(--cafe); color: var(--crema); }

  .escenario {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: end center;
    z-index: 2;
    touch-action: none;
  }

  .planta {
    height: min(82vh, 760px);
    width: auto;
    aspect-ratio: 400 / 560;
    overflow: visible;
    cursor: pointer;
    transform-origin: 50% 100%;
    animation: crece 1.6s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes crece { from { transform: scaleY(.05) scaleX(.6); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }

  .planta .todo   { transform-box: view-box; transform-origin: 200px 545px; animation: brisa 6s ease-in-out infinite; }
  .planta .cabeza { transform-box: view-box; transform-origin: 200px 190px; animation: cabecea 5s ease-in-out infinite; }
  .planta .petalos-atras, .planta .petalos-frente { transform-box: view-box; transform-origin: 200px 190px; }

  @keyframes brisa   { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
  @keyframes cabecea { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes gira    { to { transform: rotate(360deg); } }
  @keyframes gira-inv{ to { transform: rotate(-360deg); } }
  @keyframes late    { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* Al pasar el mouse sobre el girasol */
  .planta:hover .todo   { animation-duration: 2.2s; }
  .planta:hover .cabeza { animation: cabecea 1.6s ease-in-out infinite, late 1.2s ease-in-out infinite; }
  .planta:hover .petalos-atras  { animation: gira 14s linear infinite; }
  .planta:hover .petalos-frente { animation: gira-inv 18s linear infinite; }


  .planta-chica {
    position: absolute;
    bottom: 0;
    z-index: 1;
    height: min(44vh, 400px);
    animation-delay: .5s;
  }
  .planta-chica.izq { left: clamp(4.5rem, 13vw, 15rem); }
  .planta-chica.der { right: clamp(.5rem, 13vw, 15rem); height: min(37vh, 340px); animation-delay: .8s; }
  .planta-chica .todo   { animation-delay: -2s; }
  .planta-chica.der .todo { animation-delay: -4s; }
  .planta-chica.der .cabeza { animation-delay: -1.5s; }
  .planta:not(.planta-chica) { position: relative; z-index: 2; }

  /* Mariposas */
  .mariposa {
    position: absolute;
    left: 0; top: 0;
    width: 76px;
    margin: -38px 0 0 -38px;
    pointer-events: none;
    z-index: 3;
    will-change: transform;
    opacity: 0;
    transition: opacity 1.2s ease 1.4s;
  }
  #girasol.listo .mariposa { opacity: 1; }
  .mariposa svg { width: 100%; display: block; overflow: visible; }
  .ala { transform-box: view-box; transform-origin: 50px 40px; animation: aletea .26s ease-in-out infinite alternate; }
  @keyframes aletea { from { transform: scaleX(1); } to { transform: scaleX(.22); } }

  @media (prefers-reduced-motion: reduce) {
    .planta, .planta * , .ala { animation: none !important; }
    .vista, .mariposa { transition: none; }
  }
</style>
</head>
<body>

<!-- ============ PÁGINA 1 ============ -->
<main class="vista" id="portada">
  <div class="pila">
    <div class="par eco" style="opacity:.18" aria-hidden="true"><span class="hola">Hola</span><span class="nombre">Camila</span></div>
    <div class="par eco" style="opacity:.5" aria-hidden="true"><span class="hola">Hola</span><span class="nombre">Camila</span></div>
    <h1 class="par"><span class="hola">Hola</span><span class="nombre">Camila</span></h1>
    <div class="par eco" style="opacity:.5" aria-hidden="true"><span class="hola">Hola</span><span class="nombre">Camila</span></div>
    <div class="par eco" style="opacity:.18" aria-hidden="true"><span class="hola">Hola</span><span class="nombre">Camila</span></div>
  </div>
  <button class="boton-flor" id="btnFlor" type="button">Ver Flor</button>
</main>

<!-- ============ PÁGINA 2 ============ -->
<section class="vista" id="girasol" hidden>
  <button class="volver" id="btnVolver" type="button">Volver</button>

  <p class="detalle" id="detalle" tabindex="-1">
    Para mi hermanita Capibara
    <small>Pasa el mouse sobre el girasol</small>
  </p>
  <div class="titulo-vertical" aria-label="¡Feliz día!">  </div>

  <div class="escenario" id="escenario">

    <svg class="planta" id="planta" viewBox="0 0 400 560" role="img" aria-label="Un girasol">
      <g class="todo">
        <!-- tallo -->
        <path d="M200 240 C197 330 207 430 200 548" stroke="#2F4A1C" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M200 240 C197 330 207 430 200 548" stroke="#5B9A3E" stroke-width="10" fill="none" stroke-linecap="round"/>

        <!-- hojas -->
        <g stroke="#2F4A1C" stroke-width="3" stroke-linejoin="round">
          <path d="M203 352 C250 296 318 306 340 356 C298 394 236 394 203 352Z" fill="#5B9A3E"/>
          <path d="M199 430 C150 372 88 386 62 436 C104 470 168 470 199 430Z" fill="#4E8B3A"/>
        </g>
        <g stroke="#2F4A1C" stroke-width="2.5" fill="none" stroke-linecap="round">
          <path d="M203 352 C245 340 290 342 334 356"/>
          <path d="M199 430 C158 418 112 422 68 436"/>
        </g>
        <path d="M228 340 C250 322 280 320 306 330" stroke="#8CC26A" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
        <path d="M172 418 C150 400 122 398 96 408" stroke="#8CC26A" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>

        <!-- flor -->
        <g class="cabeza">
          <g class="petalos-atras" id="petalosAtras"></g>
          <g class="petalos-frente" id="petalosFrente"></g>
          <circle cx="200" cy="190" r="56" fill="#7A3B1A" stroke="#3B1F0D" stroke-width="3"/>
          <circle cx="200" cy="190" r="48" fill="#8F4A22"/>
          <g id="semillas" fill="#3B1F0D" opacity=".85"></g>
          <path d="M162 168 C172 150 194 142 214 146" stroke="#C97B3A" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"/>
        </g>
      </g>
    </svg>

    <!-- Mariposas amarillas -->
    <template id="tplMariposa">
      <div class="mariposa">
        <svg viewBox="0 0 100 80" aria-hidden="true">
          <g class="ala">
            <g>
              <path d="M50 38 C58 8 94 0 97 22 C100 40 72 46 50 40Z" fill="#FFD93D" stroke="#6B3D12" stroke-width="2" stroke-linejoin="round"/>
              <path d="M50 42 C70 46 90 54 82 68 C74 80 56 66 50 46Z" fill="#F5A31A" stroke="#6B3D12" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="78" cy="22" r="5" fill="#FFF3B0" stroke="#6B3D12" stroke-width="1.2"/>
              <circle cx="72" cy="60" r="3" fill="#FFF3B0" stroke="#6B3D12" stroke-width="1"/>
            </g>
          </g>
          <g transform="translate(100 0) scale(-1 1)">
            <g class="ala">
              <g>
                <path d="M50 38 C58 8 94 0 97 22 C100 40 72 46 50 40Z" fill="#FFD93D" stroke="#6B3D12" stroke-width="2" stroke-linejoin="round"/>
                <path d="M50 42 C70 46 90 54 82 68 C74 80 56 66 50 46Z" fill="#F5A31A" stroke="#6B3D12" stroke-width="2" stroke-linejoin="round"/>
                <circle cx="78" cy="22" r="5" fill="#FFF3B0" stroke="#6B3D12" stroke-width="1.2"/>
                <circle cx="72" cy="60" r="3" fill="#FFF3B0" stroke="#6B3D12" stroke-width="1"/>
              </g>
            </g>
          </g>
          <ellipse cx="50" cy="42" rx="3" ry="15" fill="#4A2A12"/>
          <path d="M49 28 C45 18 40 14 36 14 M51 28 C55 18 60 14 64 14" stroke="#4A2A12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </template>
  </div>
</section>




<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const reducido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Construir el girasol ---------- */
  function petalos(grupo, cantidad, largo, ancho, relleno, desfase) {
    for (let i = 0; i < cantidad; i++) {
      const p = document.createElementNS(NS, "path");
      const y0 = -44, y1 = -largo;
      p.setAttribute("d",
        `M0 ${y0} C${ancho} ${y0 - 22} ${ancho + 2} ${y1 + 34} 0 ${y1} C${-ancho - 2} ${y1 + 34} ${-ancho} ${y0 - 22} 0 ${y0}Z`);
      p.setAttribute("fill", relleno);
      p.setAttribute("stroke", "#6B3D12");
      p.setAttribute("stroke-width", "2.6");
      p.setAttribute("stroke-linejoin", "round");
      p.setAttribute("transform", `translate(200 190) rotate(${desfase + (360 / cantidad) * i})`);
      grupo.appendChild(p);
      // nervadura
      const n = document.createElementNS(NS, "path");
      n.setAttribute("d", `M0 ${y0 - 6} L0 ${y1 + 22}`);
      n.setAttribute("stroke", "#C97B14");
      n.setAttribute("stroke-width", "1.6");
      n.setAttribute("stroke-linecap", "round");
      n.setAttribute("opacity", ".65");
      n.setAttribute("transform", `translate(200 190) rotate(${desfase + (360 / cantidad) * i})`);
      grupo.appendChild(n);
    }
  }
  petalos(document.getElementById("petalosAtras"), 18, 138, 22, "#F5A31A", 0);
  petalos(document.getElementById("petalosFrente"), 18, 122, 21, "#FDC72B", 10);

  const semillas = document.getElementById("semillas");
  const dorado = Math.PI * (3 - Math.sqrt(5));
  for (let i = 1; i < 135; i++) {
    const r = 4.1 * Math.sqrt(i), a = i * dorado;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (200 + r * Math.cos(a)).toFixed(2));
    c.setAttribute("cy", (190 + r * Math.sin(a)).toFixed(2));
    c.setAttribute("r", (1.2 + i / 135 * 1.1).toFixed(2));
    semillas.appendChild(c);
  }

  /* ---------- Girasoles pequeños ---------- */
  const escenario0 = document.getElementById("escenario");

  const principal = document.getElementById("planta");
  ["izq", "der"].forEach(lado => {
    const c = principal.cloneNode(true);
    c.removeAttribute("id");
    c.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
    c.setAttribute("aria-hidden", "true");
    c.removeAttribute("role");
    c.removeAttribute("aria-label");
    c.classList.add("planta-chica", lado);
    escenario0.insertBefore(c, principal);
  });

  /* ---------- Mariposas ---------- */
  const escenario = document.getElementById("escenario");
  const plantilla = document.getElementById("tplMariposa");
  const config = [
    { hx: .20, hy: .22, s: 1.0 },
    { hx: .80, hy: .30, s: .85 },
    { hx: .70, hy: .64, s: .95 },
    { hx: .28, hy: .56, s: .7  },
    { hx: .58, hy: .14, s: .6  }
  ];
  const mariposas = config.map((c, i) => {
    const el = plantilla.content.firstElementChild.cloneNode(true);
    // cada mariposa aletea a su propio ritmo
    el.querySelectorAll(".ala").forEach(a => a.style.animationDuration = (0.22 + i * 0.03) + "s");
    escenario.appendChild(el);
    return { el, ...c, ph: i * 1.7, x: null, y: null };
  });

  let mouse = { x: 0, y: 0, dentro: false };
  let toque = null;



  
  escenario.addEventListener("pointermove", e => {
    const girasolBajoCursor = e.target.closest(".planta");
    const r = escenario.getBoundingClientRect();

    if (girasolBajoCursor) {
      const girasolRect = girasolBajoCursor.getBoundingClientRect();
      toque = {
        x: girasolRect.left + girasolRect.width / 2 - r.left,
        y: girasolRect.top + girasolRect.height * 0.34 - r.top,
        hasta: performance.now() + 100
      };
      mouse.dentro = false;
      return;
    }

    toque = null;
    mouse = { x: e.clientX - r.left, y: e.clientY - r.top, dentro: true };
  });
  escenario.addEventListener("pointerleave", () => {
    mouse.dentro = false;
    toque = null;
  });
  let activo = false;
  function cuadro(t) {
    if (!activo) return;
    const w = escenario.clientWidth, h = escenario.clientHeight;
    mariposas.forEach(m => {
      let tx = m.hx * w + Math.sin(t / 1500 + m.ph) * 46;
      let ty = m.hy * h + Math.cos(t / 1150 + m.ph * 1.3) * 34;
      let k = 0.03;

      if (m.x === null) { m.x = tx; m.y = ty; }

      if (toque && t < toque.hasta) {
        const dx = m.x - toque.x;
        const dy = m.y - toque.y;
        const distancia = Math.max(Math.hypot(dx, dy), 1);
        tx = m.x + (dx / distancia) * 50;
        ty = m.y + (dy / distancia) * 50;
        k = 0.08;
      } else if (mouse.dentro) {
        tx = mouse.x + Math.cos(t / 650 + m.ph * 2) * 80;
        ty = mouse.y + Math.sin(t / 850 + m.ph * 2) * 56;
        k = 0.06;
      }
      const vx = (tx - m.x) * k;
      m.x += vx;
      m.y += (ty - m.y) * k;
      const rot = Math.max(-28, Math.min(28, vx * 5));
      m.el.style.transform = `translate(${m.x}px, ${m.y}px) rotate(${rot}deg) scale(${m.s})`;
    });
    requestAnimationFrame(cuadro);
  }







  
  function colocarEstaticas() {
    const w = escenario.clientWidth, h = escenario.clientHeight;
    mariposas.forEach(m => {
      m.el.style.transform = `translate(${m.hx * w}px, ${m.hy * h}px) scale(${m.s})`;
    });
  }

  /* ---------- Cambio de página ---------- */
  const portada = document.getElementById("portada");
  const girasol = document.getElementById("girasol");

  document.getElementById("btnFlor").addEventListener("click", () => {
    portada.classList.add("saliendo");
    setTimeout(() => {
      portada.hidden = true;
      portada.classList.remove("saliendo");
      document.body.style.background = "#F7E9D0";
      girasol.hidden = false;
      // reiniciar animación de crecimiento
      const planta = document.getElementById("planta");
      planta.style.animation = "none"; void planta.offsetWidth; planta.style.animation = "";
      mariposas.forEach(m => { m.x = null; });
      girasol.classList.remove("listo");
      requestAnimationFrame(() => girasol.classList.add("listo"));
      activo = !reducido;
      if (reducido) colocarEstaticas(); else requestAnimationFrame(cuadro);
      document.getElementById("detalle").focus({ preventScroll: true });
    }, 600);
  });

  document.getElementById("btnVolver").addEventListener("click", () => {
    activo = false;
    girasol.hidden = true;
    girasol.classList.remove("listo");
    document.body.style.background = "";
    portada.hidden = false;
    document.getElementById("btnFlor").focus();
  });
})();
</script>
</body>
</html>
